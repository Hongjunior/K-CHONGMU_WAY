{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <div class="page-header">
        <h2>총 동선</h2>
    </div>
    <p class="page-hint">그날 등록된 일정을 방문 순서대로 이어서 보여줍니다. 셔틀 구간은 실선, 도보 구간은 점선으로 표시됩니다.</p>

    <div class="date-nav">
        <a href="{{ url_for('mapview.day_route', date=prev_date) }}">← 전날</a>
        <form method="get" class="date-nav-form">
            <input type="date" name="date" value="{{ date_str }}" onchange="this.form.submit()">
        </form>
        <a href="{{ url_for('mapview.day_route', date=next_date) }}">다음날 →</a>
        {% if date_str != today %}
        <a class="btn-link" href="{{ url_for('mapview.day_route', date=today) }}">오늘로</a>
        {% endif %}
    </div>

    {% include "map/_route_section.html" %}
</section>

{% endblock %}
