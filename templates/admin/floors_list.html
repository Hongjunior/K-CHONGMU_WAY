{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <div class="page-header">
        <h2>층 관리</h2>
        <a class="btn-link" href="{{ url_for('admin.dashboard') }}">← 대시보드</a>
    </div>

    <form method="get" class="filter-bar-inline">
        <select name="building_id" onchange="this.form.submit()">
            <option value="">전체 건물</option>
            {% for b in buildings %}
            <option value="{{ b['id'] }}" {{ 'selected' if b['id'] == selected_building_id else '' }}>{{ b['name'] }}</option>
            {% endfor %}
        </select>
    </form>

    <a class="btn-primary" href="{{ url_for('admin.floors_new') }}">+ 층 등록</a>

    <table class="data-table">
        <thead>
            <tr><th>ID</th><th>건물</th><th>층 이름</th><th>정렬순서</th><th></th></tr>
        </thead>
        <tbody>
        {% for f in floors %}
            <tr>
                <td>{{ f['id'] }}</td>
                <td>{{ f['building_name'] }}</td>
                <td>{{ f['floor_label'] }}</td>
                <td>{{ f['floor_order'] }}</td>
                <td class="row-actions">
                    <a class="btn-edit" href="{{ url_for('admin.floors_edit', floor_id=f['id']) }}">수정</a>
                    <form action="{{ url_for('admin.floors_delete', floor_id=f['id']) }}" method="post" onsubmit="return confirm('삭제하시겠습니까? 하위 데이터가 있으면 삭제되지 않습니다.');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="5" class="empty-state">등록된 층이 없습니다.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</section>

{% endblock %}
