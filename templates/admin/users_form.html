{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <h2>사용자 추가</h2>
    <form action="{{ url_for('admin.users_new') }}" method="post" class="entity-form">
        <label>아이디</label>
        <input type="text" name="username" required>

        <label>비밀번호</label>
        <input type="password" name="password" required>

        <label>권한</label>
        <select name="role">
            {% for value, label in role_labels.items() %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <div class="form-actions">
            <button type="submit">추가</button>
            <a href="{{ url_for('admin.users_list') }}" class="btn-cancel">취소</a>
        </div>
    </form>
</section>

{% endblock %}
