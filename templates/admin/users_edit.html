{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <h2>{{ user['username'] }} 정보 수정</h2>
    <form action="{{ url_for('admin.users_edit', user_id=user['id']) }}" method="post" class="entity-form">
        <label>소속</label>
        <input type="text" name="department" value="{{ user['department'] or '' }}" placeholder="예: 영업팀">

        <label>직책</label>
        <input type="text" name="job_title" value="{{ user['job_title'] or '' }}" placeholder="예: 대리">

        <div class="form-actions">
            <button type="submit">저장</button>
            <a href="{{ url_for('admin.users_list') }}" class="btn-cancel">취소</a>
        </div>
    </form>
</section>

{% endblock %}
