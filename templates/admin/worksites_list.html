{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <div class="page-header">
        <h2>사업장 관리</h2>
        <a class="btn-link" href="{{ url_for('admin.dashboard') }}">← 대시보드</a>
    </div>

    <a class="btn-primary" href="{{ url_for('admin.worksites_new') }}">+ 사업장 등록</a>

    <table class="data-table">
        <thead>
            <tr><th>ID</th><th>이름</th><th>설명</th><th>사용 여부</th><th></th></tr>
        </thead>
        <tbody>
        {% for w in worksites %}
            <tr>
                <td>{{ w['id'] }}</td>
                <td>{{ w['name'] }}</td>
                <td>{{ w['description'] or '-' }}</td>
                <td>{{ '사용' if w['active'] else '미사용' }}</td>
                <td class="row-actions">
                    <a class="btn-edit" href="{{ url_for('admin.worksites_edit', worksite_id=w['id']) }}">수정</a>
                    <form action="{{ url_for('admin.worksites_delete', worksite_id=w['id']) }}" method="post" onsubmit="return confirm('삭제하시겠습니까? 하위 데이터가 있으면 삭제되지 않습니다.');">
                        <button type="submit" class="btn-delete">삭제</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="5" class="empty-state">등록된 사업장이 없습니다.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</section>

{% endblock %}
